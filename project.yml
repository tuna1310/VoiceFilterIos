name: VoiceFilter_iOS
options:
  bundleIdPrefix: com.voicefilter
  deploymentTarget:
    iOS: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VoiceFilter_iOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VoiceFilter_iOS
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_NAME: VoiceFilter_iOS
        PRODUCT_BUNDLE_IDENTIFIER: com.voicefilter.speakchallenge
        INFOPLIST_FILE: VoiceFilter_iOS/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  VoiceFilter_iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: VoiceFilter_iOSTests
    dependencies:
      - target: VoiceFilter_iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voicefilter.speakchallenge.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  VoiceFilter_iOS:
    build:
      targets:
        VoiceFilter_iOS: all
        VoiceFilter_iOSTests: [test]
    test:
      targets:
        - VoiceFilter_iOSTests
    archive:
      config: Release
